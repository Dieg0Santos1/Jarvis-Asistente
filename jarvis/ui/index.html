<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
  <main class="overlay-shell">
    <section class="jarvis-card">
      <div class="card-glow"></div>
      <div class="hud-grid"></div>
      <div class="corner corner-tl"></div>
      <div class="corner corner-br"></div>

      <header class="status-header">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">JARVIS</p>
          <h1 class="state-label">IDLE</h1>
        </div>
        <div class="header-badges">
          <span class="security-badge">SIN IDENTIFICAR</span>
          <span class="hud-code">MK-01</span>
        </div>
      </header>

      <section class="orb-panel" aria-label="Estado visual de Jarvis">
        <div class="radar-sweep"></div>
        <div class="scan-line"></div>
        <div class="orb-ring ring-a"></div>
        <div class="orb-ring ring-b"></div>
        <div class="orb-ring ring-c"></div>
        <div class="orb-ring ring-d"></div>
        <div class="orb-core">
          <span></span>
        </div>
        <div class="particle-field">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="camera-preview" aria-hidden="true">
          <div class="camera-frame">
            <img alt="" class="camera-preview-image">
            <span class="camera-preview-label">VISION FEED</span>
            <span class="camera-preview-scan"></span>
          </div>
        </div>
      </section>

      <section class="voice-bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span>
      </section>

      <section class="detail-panel">
        <p class="detail-kicker">Sistema de voz</p>
        <p class="detail-text">En espera</p>
      </section>

      <footer class="hud-footer">
        <span>ONLINE</span>
        <span class="hud-pulse">CORE STABLE</span>
        <span class="signal">VOICE LINK</span>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
